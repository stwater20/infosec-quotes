<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安 meme 語錄產生器 · SEC_MEME</title>
<meta name="description" content="資安 meme 語錄隨機產生器 — 駭客終端機風。每日一則、一鍵複製、圖卡下載。純娛樂,請勿當真。">
<style>
  /* 暖灰紙張終端 —— 低對比、不發光、耐看 */
  :root{
    --bg:#f4f1ea; --fg:#3a3532; --dim:#8a8175; --accent:#b06a3a;
    --card:#fbf9f3; --border:#ddd6c8; --glow:none;
  }
  :root[data-theme="warm-dark"]{
    --bg:#2b2622; --fg:#ded6c8; --dim:#9a8f7e; --accent:#d8a86a;
    --card:#332e29; --border:#4a433b; --glow:none;
  }
  :root[data-theme="sage"]{
    --bg:#eef0ea; --fg:#39423b; --dim:#7d897d; --accent:#5a7d8a;
    --card:#f7f9f4; --border:#cdd6c9; --glow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    display:flex; flex-direction:column; min-height:100vh; line-height:1.6; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px);
    opacity:.5;
  }
  header{padding:14px 18px; border-bottom:1px dashed var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .brand{font-weight:bold; letter-spacing:1px; text-shadow:var(--glow)}
  .brand .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .tools{display:flex; gap:8px; flex-wrap:wrap}
  button{background:transparent; color:var(--fg); border:1px solid var(--border); padding:7px 12px; font-family:inherit; font-size:13px; cursor:pointer; border-radius:3px; transition:.15s}
  button:hover{background:var(--fg); color:var(--bg); box-shadow:var(--glow)}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:24px}
  .terminal{width:100%; max-width:760px; background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--glow)}
  .titlebar{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border); font-size:12px; color:var(--dim)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);opacity:.6}
  .body{padding:26px 28px 30px}
  .line{color:var(--dim); font-size:13px; margin-bottom:6px}
  .quote{font-size:clamp(19px,3.4vw,27px); margin:10px 0 16px; min-height:2em; text-shadow:var(--glow)}
  .author{color:var(--accent); font-size:15px}
  .author::before{content:"— "}
  .meta{margin-top:18px; color:var(--dim); font-size:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px}
  .actions button{padding:10px 16px}
  footer{padding:14px 18px; text-align:center; color:var(--dim); font-size:12px; border-top:1px dashed var(--border)}
  a{color:var(--accent)}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:4px; font-size:13px; opacity:0; transition:.25s; z-index:5; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .disclaimer{color:var(--dim); font-size:11px; margin-top:14px; opacity:.8}
</style>
</head>
<body>
<header>
  <div class="brand">root@sec-meme:~# <span class="cursor">█</span></div>
  <div class="tools">
    <button id="themeBtn" title="切換主題">◐ 主題</button>
    <button id="dailyBtn" title="每日一則">📅 每日一則</button>
  </div>
</header>

<main>
  <div class="terminal" id="card">
    <div class="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span style="margin-left:6px">— bullshit_wisdom.log —</span>
    </div>
    <div class="body">
      <div class="line" id="cmdLine">$ ./bs --random</div>
      <div class="quote" id="quote">載入中…</div>
      <div class="author" id="author"></div>
      <div class="meta">
        <span id="tagLine"></span>
        <span id="idxLine"></span>
      </div>
      <div class="actions">
        <button id="nextBtn">↻ 再來一句</button>
        <button id="copyBtn">⧉ 複製</button>
        <button id="shareBtn">↗ 分享</button>
        <button id="dlBtn">⬇ 下載圖卡</button>
      </div>
      <div class="disclaimer">⚠ 本產生器內容純屬娛樂,不代表任何資安建議,請勿當真也請勿拿去嗆同事。</div>
    </div>
  </div>
</main>

<footer>
  SEC_MEME · 資安 meme 語錄產生器 · 收錄 <span id="count"></span> 句 ·
  <a href="serious.html">切換正經版 →</a> · <a href="index.html">首頁</a> · <a href="https://sectools.tw/tools" target="_blank" rel="noopener">資安工具箱</a>
</footer>

<div class="toast" id="toast"></div>

<script>
let QUOTES = [{t:"載入 meme 語錄中…", a:"system", tag:"boot"}];
const $ = s => document.querySelector(s);
const root = document.documentElement;
const themes = ["", "warm-dark", "sage"];
let ti = 0, cur = 0;

function hashDate(){ const d=new Date(); return (d.getFullYear()*372 + d.getMonth()*31 + d.getDate()) % QUOTES.length; }
function typeQuote(text){ const el=$("#quote"); el.textContent=""; let i=0; clearInterval(el._iv); el._iv=setInterval(()=>{ el.textContent=text.slice(0,++i); if(i>=text.length)clearInterval(el._iv); },14); }
function render(i, daily){
  cur=i; const q=QUOTES[i];
  $("#cmdLine").textContent = daily ? "$ ./bs --today" : "$ ./bs --random";
  typeQuote(q.t);
  $("#author").textContent = q.a || "匿名鍵盤俠";
  $("#tagLine").textContent = "# " + (q.tag||"meme");
  $("#idxLine").textContent = String(i+1).padStart(3,"0")+" / "+String(QUOTES.length).padStart(3,"0");
}
function randomQuote(){ let n; do{ n=Math.floor(Math.random()*QUOTES.length); }while(n===cur&&QUOTES.length>1); render(n,false); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }

$("#nextBtn").onclick = randomQuote;
$("#dailyBtn").onclick = ()=>{ render(hashDate(),true); toast("每日一則 · "+new Date().toLocaleDateString("zh-TW")); };
$("#themeBtn").onclick = ()=>{ ti=(ti+1)%themes.length; root.setAttribute("data-theme",themes[ti]); localStorage.setItem("bs_theme",themes[ti]); };
$("#copyBtn").onclick = async ()=>{ const q=QUOTES[cur]; try{ await navigator.clipboard.writeText(`「${q.t}」— ${q.a||"匿名鍵盤俠"}`); toast("已複製到剪貼簿"); }catch{ toast("複製失敗"); } };
$("#shareBtn").onclick = async ()=>{ const q=QUOTES[cur]; const data={title:"資安 meme 語錄", text:`「${q.t}」— ${q.a||"匿名鍵盤俠"}`, url:location.href}; if(navigator.share){ try{ await navigator.share(data); }catch{} } else { await navigator.clipboard.writeText(data.text+" "+data.url); toast("連結已複製"); } };
$("#dlBtn").onclick = ()=>drawCard(QUOTES[cur]);

function drawCard(q){
  const W=1200,H=630, c=document.createElement("canvas"); c.width=W;c.height=H; const x=c.getContext("2d");
  const cs=getComputedStyle(root);
  const bg=cs.getPropertyValue("--card").trim()||"#150a14";
  const fg=cs.getPropertyValue("--fg").trim()||"#ff3caa";
  const dim=cs.getPropertyValue("--dim").trim()||"#7a1c58";
  const acc=cs.getPropertyValue("--accent").trim()||"#00e0ff";
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  x.strokeStyle=dim; x.lineWidth=2; x.strokeRect(24,24,W-48,H-48);
  x.globalAlpha=.06; x.fillStyle="#fff"; for(let y=0;y<H;y+=4) x.fillRect(0,y,W,1); x.globalAlpha=1;
  x.font="26px monospace"; x.fillStyle=dim; x.fillText("root@sec-meme:~# ./bs --card", 60, 90);
  x.fillStyle=fg; x.font="bold 46px monospace";
  const words=q.t.split(""); let line="", lines=[], maxW=W-140; // 中文逐字排版
  for(const w of words){ const test=line+w; if(x.measureText(test).width>maxW){lines.push(line);line=w;} else line=test; }
  if(line)lines.push(line);
  let ly=200+(4-Math.min(lines.length,5))*22;
  lines.slice(0,6).forEach(l=>{ x.fillText(l,70,ly); ly+=64; });
  x.fillStyle=acc; x.font="32px monospace"; x.fillText("— "+(q.a||"匿名鍵盤俠"), 70, ly+30);
  x.fillStyle=dim; x.font="22px monospace"; x.fillText("#"+(q.tag||"meme"), 70, H-70);
  x.textAlign="right"; x.fillText("SEC_MEME · 資安 meme 語錄 · 純屬娛樂", W-70, H-70); x.textAlign="left";
  const a=document.createElement("a"); a.download="sec-meme-"+(cur+1)+".png"; a.href=c.toDataURL("image/png"); a.click();
  toast("圖卡已下載");
}

const saved=localStorage.getItem("bs_theme"); if(saved!==null){ ti=themes.indexOf(saved); if(ti<0)ti=0; root.setAttribute("data-theme",themes[ti]); }
fetch("meme.quotes.json",{cache:"no-store"})
  .then(r=>r.json())
  .then(d=>{ if(Array.isArray(d)&&d.length){ QUOTES=d; } })
  .catch(()=>{})
  .finally(()=>{ $("#count").textContent=QUOTES.length; randomQuote(); });
</script>
</body>
</html>
